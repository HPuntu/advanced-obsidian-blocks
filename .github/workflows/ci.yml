name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run sync:version
      - run: git diff --exit-code manifest.json versions.json
      - run: npm audit --omit=dev
      - run: npm run package
      - run: unzip -l dist/advanced-obsidian-blocks-$(node -p "require('./manifest.json').version").zip
