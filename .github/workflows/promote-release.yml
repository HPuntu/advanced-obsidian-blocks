name: Promote release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  cancel-in-progress: false
  group: advanced-blocks-release

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, 'Release ') &&
      !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24
      - run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Decide release version
        id: release
        env:
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "initial=true" >> "$GITHUB_OUTPUT"
            echo "bump=initial" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$MANUAL_BUMP" ]; then
            BUMP="$MANUAL_BUMP"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            COMMITS=$(git log --format=%B "$RANGE" 2>/dev/null || git log -1 --format=%B)
            if echo "$COMMITS" | grep -Eiq 'BREAKING CHANGE|\[major\]|#major'; then
              BUMP=major
            elif echo "$COMMITS" | grep -Eiq '\[minor\]|#minor|feat(\(.+\))?:'; then
              BUMP=minor
            else
              BUMP=patch
            fi
          fi
          echo "initial=false" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump version
        if: steps.release.outputs.initial != 'true'
        run: |
          NEXT_VERSION=$(node scripts/next-release-version.mjs "${{ steps.release.outputs.bump }}")
          npm version "$NEXT_VERSION" --no-git-tag-version
          npm run sync:version

      - name: Verify initial metadata
        if: steps.release.outputs.initial == 'true'
        run: npm run sync:version

      - name: Update changelog
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            RELEASE_COMMITS=$(git log --pretty="- %s (%h)" "${LAST_TAG}..${RELEASE_SHA}")
          else
            RELEASE_COMMITS=$(git log --pretty="- %s (%h)")
          fi
          VERSION="$VERSION" RELEASE_DATE="$RELEASE_DATE" RELEASE_COMMITS="$RELEASE_COMMITS" node scripts/update-changelog.mjs

      - run: npm run release:check

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Commit release metadata and tag
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          git add package.json package-lock.json manifest.json versions.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Release ${VERSION}"
          fi
          if git rev-parse --verify --quiet "refs/tags/${VERSION}"; then
            echo "Tag ${VERSION} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git tag "${VERSION}"

      - name: Push release metadata and tag
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          git push origin HEAD:main
          git push origin "$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          gh release create "$VERSION" \
            main.js manifest.json styles.css \
            --generate-notes \
            --title "$VERSION"
